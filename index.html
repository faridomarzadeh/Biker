<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roar Cycle - Bike Repairs in Toronto</title>
    <!-- Eric Meyer's Reset CSS -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="images/logo-roar-bikes.png" alt="logo for Roar Cycle" class="logo__image" />
            </div>
            <nav>
                Book Online About Contact
            </nav>
        </header>
        <main>
            <div class="main-content">
                <h1>Mobile bike repairs.</h1>
                <p>Many people have difficulty getting their bikes to a bike shop. We call to your office or home anywhere in greater Dublin.</p>
                <p>
                    Fast, convenient bike servicing with up-front pricing. All without the hassle of taking your bike
                    into a shop.
                </p>
            </div>
            <div class="main-image">
                <img src="images/image-bike-repair-service.jpg" alt="Person repairing a bike" />
            </div>
        </main>
        <div class="cards">
            <div class="card card--1"></div>
            <div class="card card--2"></div>
            <div class="card card--3"></div>
        </div>
    </div>
</body>

</html>
